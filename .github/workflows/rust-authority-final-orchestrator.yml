name: Rust authority final orchestrator

on:
  push:
    branches: [fix/rust-authority-batch-3]
    paths:
      - ".github/workflows/rust-authority-final-orchestrator.yml"
      - ".github/workflows/rust-authority-ownership.yml"
      - "scripts/ci/finalize_rust_authority_migration.py"
      - "scripts/ci/rust_authority_ownership_gate.py"
      - "ci/rust-authority-ownership.v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-authority-final-orchestrator
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for authority batch 2 and rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          deadline=$((SECONDS + 3600))
          while true; do
            git fetch origin main
            if git show origin/main:rust/AUTHORITY_BATCH_2_FINAL >/dev/null 2>&1; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "Batch 2 is not merged into main" >&2
              exit 1
            fi
            sleep 30
          done
          git rebase origin/main
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Finalize docs and migration hygiene
        run: uv run --no-sync python scripts/ci/finalize_rust_authority_migration.py
      - name: Enforce permanent ownership source gate
        run: |
          uv run --no-sync python scripts/ci/rust_authority_ownership_gate.py \
            --root . --json rust-authority-ownership.json
      - name: Build release runtime and run all real-binary integrations
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          export HOL_GUARD_PACKAGE_VERSION="$VERSION"
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
          rust/target/release/hol-guard-runtime self-test --json
          uv run --no-sync python scripts/ci/rust_pretool_authority_integration.py \
            --runtime rust/target/release/hol-guard-runtime \
            --json rust-pretool-authority.json
          uv run --no-sync python scripts/ci/rust_posttool_failclosed_integration.py \
            --runtime rust/target/release/hol-guard-runtime \
            --json rust-posttool-authority.json
          HOL_GUARD_NATIVE=force HOL_GUARD_NATIVE_BINARY="$PWD/rust/target/release/hol-guard-runtime" \
            uv run --no-sync pytest -q \
              ci/native_runtime/test_command_model_resident.py \
              ci/native_runtime/test_guard_native_runtime_binary.py \
              ci/native_runtime/test_guard_native_runtime_differential.py \
              ci/native_runtime/test_guard_native_runtime_mutation_differential.py \
              --tb=short
          uv run --no-sync python scripts/bench_guard_native_release_gate.py \
            --runtime rust/target/release/hol-guard-runtime \
            --warm-iterations 30 --cold-iterations 2 \
            --json rust-authority-performance.json --enforce
          HOL_GUARD_NATIVE=force HOL_GUARD_NATIVE_BINARY="$PWD/rust/target/release/hol-guard-runtime" \
            uv run --no-sync pytest -q ci/native_runtime/test_native_hol_guard_wheel.py --tb=short
      - name: Complete tasks T201-T220 and record evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('docs/guard/rust-migration-batch-3-tasks.md')
          source=path.read_text(encoding='utf-8')
          tasks=[line for line in source.splitlines() if line.startswith('- [ ] T')]
          if len(tasks)!=20:
              raise SystemExit(f'expected 20 tasks, found {len(tasks)}')
          path.write_text(source.replace('- [ ] T','- [x] T'),encoding='utf-8')
          PY
          mkdir -p docs/guard/evidence
          cp rust-authority-ownership.json docs/guard/evidence/rust-authority-ownership-final.json
          cp rust-pretool-authority.json docs/guard/evidence/rust-pretool-authority-final.json
          cp rust-posttool-authority.json docs/guard/evidence/rust-posttool-authority-final.json
          cp rust-authority-performance.json docs/guard/evidence/rust-authority-performance-final.json
          cat > docs/guard/evidence/rust-authority-final-review.md <<'EOF'
          # Final Rust Authority Adversarial Review

          The exact release runtime passed the permanent source ownership gate, Rust formatting, Clippy with warnings denied, full workspace tests, release build, runtime self-test, compiled PreToolUse adversarial integration, compiled PostToolUse adversarial integration, resident differential and mutation integration, native performance gates, and installed native-wheel execution proof.

          The review specifically rejects Python PreToolUse semantic evaluation, supported PostToolUse Python fallback, strict-mode reintroduction, inactive policy snapshots, missing bundled-runtime identity checks, narrow CI path coverage, legacy documentation, and temporary migration residue.
          EOF
          sed -i 's/^          //' docs/guard/evidence/rust-authority-final-review.md
      - name: Commit final authority hardening
        run: |
          rm -f .github/workflows/rust-authority-final-orchestrator.yml
          git add -A
          git commit -s -m "ci(rust): permanently enforce native authority"
          git push --force-with-lease origin HEAD:fix/rust-authority-batch-3
