name: Finalize Everyday Mode Core resumably

on:
  push:
    branches:
      - automation/everyday-mode-finalize-20260828
    paths:
      - .github/everyday-mode/run-core-v2

permissions:
  contents: write
  pull-requests: write
  checks: write
  statuses: write
  models: read

concurrency:
  group: finalize-everyday-mode-core-2629
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVERYDAY_OPENAI_MODEL: ${{ vars.EVERYDAY_MODE_OPENAI_MODEL }}
      EVERYDAY_GITHUB_MODEL: ${{ vars.EVERYDAY_MODE_GITHUB_MODEL }}
      EVERYDAY_ALLOWED_ROOTS: src,dashboard/src,tests,docs,schemas
      DELIVERY_BRANCH: feat/everyday-mode-001-100-final
      TARGET_BRANCH: release/3.2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/everyday-mode-finalize-20260828
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with: {version: '0.9.26'}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with: {bun-version: '1.3.6'}

      - name: Exit when already merged
        id: gate
        run: echo "merged=$(gh pr view 2629 --repo hashgraph-online/hol-guard --json mergedAt --jq '.mergedAt != null')" >> "$GITHUB_OUTPUT"

      - name: Prepare resumable clean delivery
        if: steps.gate.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/everyday_mode_safe_agent.py /tmp/everyday_mode_safe_agent.py
          chmod +x /tmp/everyday_mode_safe_agent.py
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p /tmp/everyday-specs
          for ref in origin/automation/everyday-mode-release-3.2-controller origin/feat/everyday-mode-001-100-v32 origin/automation/everyday-mode-finalize-20260828; do
            [ -s /tmp/everyday-specs/PRD.md ] || for p in docs/everyday-mode/HOL_GUARD_EVERYDAY_MODE_PRD.md docs/guard/everyday-mode/HOL_GUARD_EVERYDAY_MODE_PRD_AUTHORITATIVE.md; do git show "$ref:$p" > /tmp/everyday-specs/PRD.md 2>/dev/null && break || true; done
            [ -s /tmp/everyday-specs/TODO.md ] || for p in docs/everyday-mode/HOL_GUARD_EVERYDAY_MODE_TODO.md docs/guard/everyday-mode/HOL_GUARD_EVERYDAY_MODE_TODO_AUTHORITATIVE.md; do git show "$ref:$p" > /tmp/everyday-specs/TODO.md 2>/dev/null && break || true; done
          done
          if [ ! -s /tmp/everyday-specs/PRD.md ] || [ ! -s /tmp/everyday-specs/TODO.md ]; then gh issue view 2561 --repo hashgraph-online/hol-guard --json title,body --jq '"# " + .title + "\n\n" + .body' > /tmp/everyday-specs/issue.md; fi
          [ -s /tmp/everyday-specs/PRD.md ] || cp /tmp/everyday-specs/issue.md /tmp/everyday-specs/PRD.md
          [ -s /tmp/everyday-specs/TODO.md ] || cp /tmp/everyday-specs/issue.md /tmp/everyday-specs/TODO.md

          resume=0
          if git show-ref --verify --quiet "refs/remotes/origin/$DELIVERY_BRANCH" && git cat-file -e "origin/$DELIVERY_BRANCH:docs/guard/everyday-mode/delivery-state.json" 2>/dev/null; then
            if git merge-base --is-ancestor "origin/$TARGET_BRANCH" "origin/$DELIVERY_BRANCH"; then resume=1; fi
          fi
          if [ "$resume" -eq 1 ]; then
            git checkout -B "$DELIVERY_BRANCH" "origin/$DELIVERY_BRANCH"
          else
            git branch -f old001 "origin/$DELIVERY_BRANCH"
            git branch -f old101 origin/feat/everyday-mode-101-200
            git branch -f old201 origin/feat/everyday-mode-201-300
            git checkout -B "$DELIVERY_BRANCH" "origin/$TARGET_BRANCH"
            apply_ref() {
              ref="$1"; shift; base="$(git merge-base "origin/$TARGET_BRANCH" "$ref")"; git diff --binary "$base" "$ref" -- "$@" > /tmp/p.patch
              if [ -s /tmp/p.patch ]; then git apply --3way --index /tmp/p.patch || true; fi
            }
            apply_ref old001 dashboard/src/guard-types.ts dashboard/src/main.tsx dashboard/src/presentation-mode.test.ts dashboard/src/presentation-mode.ts dashboard/src/tailwind-root.css docs/guard/adr/0012-everyday-and-technical-presentation.md docs/guard/everyday-mode/copy-contract.md docs/guard/everyday-mode/vocabulary.json schemas/guard_action_explanation_v1.json src/codex_plugin_scanner/guard/config.py src/codex_plugin_scanner/guard/daemon/server.py src/codex_plugin_scanner/guard/presentation_mode.py src/codex_plugin_scanner/guard/presentation_migration.py src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py src/codex_plugin_scanner/guard/schemas/guard_action_explanation_v1.json tests/test_guard_action_explanation_contract.py tests/test_guard_codex_browser_authority.py tests/test_guard_desktop_contract.py tests/test_guard_presentation_migration.py tests/test_guard_presentation_mode.py
            for ref in old101 old201; do
              base="$(git merge-base "origin/$TARGET_BRANCH" "$ref")"; mapfile -t paths < <(git diff --name-only "$base" "$ref" | grep -E '^(src/|dashboard/src/|tests/|docs/|schemas/)' | grep -Ei '(everyday|presentation|explanation|semantic|decision.diff|guard.command.corpus|action.contract)' || true)
              [ "${#paths[@]}" -eq 0 ] || apply_ref "$ref" "${paths[@]}"
            done
            if git diff --name-only --diff-filter=U | grep -q .; then
              git diff --name-only --diff-filter=U > /tmp/conflicts.txt
              python /tmp/everyday_mode_safe_agent.py --surface core --mode repair --start 1 --end 300 --prd /tmp/everyday-specs/PRD.md --todo /tmp/everyday-specs/TODO.md --findings /tmp/conflicts.txt --max-turns 120
              git add -A
              test -z "$(git diff --name-only --diff-filter=U)"
            fi
            rm -f .github/scripts/pr_review_fix_agent.py .github/workflows/everyday-mode-finalize-2629*.yml .github/workflows/everyday-mode-release-32-finalize.yml .github/workflows/everyday-mode-source-export-2629.yml .github/workflows/pr-2629-review-fix*.yml
            mkdir -p docs/guard/everyday-mode
            printf '{"next_start":1,"completed":[]}\n' > docs/guard/everyday-mode/delivery-state.json
            git add -A; git commit -m 'feat(everyday): initialize clean release/3.2 delivery'; git push --force origin HEAD:"$DELIVERY_BRANCH"
          fi

      - name: Install dependencies
        if: steps.gate.outputs.merged != 'true'
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv pip install 'ruff==0.15.17' 'pytest==9.0.3' 'pytest-cov==7.1.0'
          if [ -f dashboard/bun.lock ] || [ -f dashboard/bun.lockb ]; then (cd dashboard && bun install --frozen-lockfile); elif [ -f dashboard/pnpm-lock.yaml ]; then corepack enable; (cd dashboard && pnpm install --frozen-lockfile); else (cd dashboard && bun install); fi

      - name: Complete remaining batches and persist each verified increment
        if: steps.gate.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          next="$(python -c "import json; print(json.load(open('docs/guard/everyday-mode/delivery-state.json'))['next_start'])")"
          for range in 1:100 101:200 201:300 301:400 401:500 501:600 601:700 701:740; do
            start="${range%%:*}"; end="${range##*:}"; [ "$end" -lt "$next" ] && continue
            mode=implement; [ "$end" -le 300 ] && mode=review
            python /tmp/everyday_mode_safe_agent.py --surface core --mode "$mode" --start "$start" --end "$end" --prd /tmp/everyday-specs/PRD.md --todo /tmp/everyday-specs/TODO.md --max-turns 80 > "/tmp/batch-${start}-${end}.log" 2>&1
            mapfile -t pyfiles < <(git diff --name-only -- '*.py' | grep -E '^(src/|tests/)' || true); [ "${#pyfiles[@]}" -eq 0 ] || { .venv/bin/ruff format "${pyfiles[@]}"; .venv/bin/ruff check --fix "${pyfiles[@]}"; }
            .venv/bin/pytest -q tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py 2>/tmp/smoke.err || { python /tmp/everyday_mode_safe_agent.py --surface core --mode repair --start "$start" --end "$end" --prd /tmp/everyday-specs/PRD.md --todo /tmp/everyday-specs/TODO.md --findings /tmp/smoke.err --max-turns 100; .venv/bin/pytest -q tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py; }
            export BATCH_START="$start" BATCH_END="$end"
            python - <<'PY'
          import json, os
          p='docs/guard/everyday-mode/delivery-state.json'; d=json.load(open(p)); s=int(os.environ['BATCH_START']); e=int(os.environ['BATCH_END'])
          if [s,e] not in d['completed']: d['completed'].append([s,e])
          d['next_start']=e+1
          open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
            git add -A; git commit -m "feat(everyday): verify EVM-$(printf '%03d' "$start")-$(printf '%03d' "$end")"; git push origin HEAD:"$DELIVERY_BRANCH"
          done

      - name: Final review, full validation, thread resolution, and merge
        if: steps.gate.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['GITHUB_TOKEN']; q='''query($c:String){repository(owner:"hashgraph-online",name:"hol-guard"){pullRequest(number:2629){reviewThreads(first:100,after:$c){nodes{id isResolved path comments(first:100){nodes{databaseId body}}} pageInfo{hasNextPage endCursor}}}}}'''; c=None; rows=[]
          while True:
            r=urllib.request.Request('https://api.github.com/graphql',data=json.dumps({'query':q,'variables':{'c':c}}).encode(),method='POST',headers={'Authorization':f'Bearer {token}','Content-Type':'application/json','User-Agent':'everyday-core-v2'})
            with urllib.request.urlopen(r,timeout=90) as x:p=json.load(x)
            t=p['data']['repository']['pullRequest']['reviewThreads']; rows += [n for n in t['nodes'] if not n['isResolved']]
            if not t['pageInfo']['hasNextPage']: break
            c=t['pageInfo']['endCursor']
          open('/tmp/threads.json','w').write(json.dumps(rows,indent=2))
          PY
          python /tmp/everyday_mode_safe_agent.py --surface core --mode review --start 1 --end 740 --prd /tmp/everyday-specs/PRD.md --todo /tmp/everyday-specs/TODO.md --findings /tmp/threads.json --max-turns 140
          mapfile -t pyfiles < <(git diff --name-only -- '*.py' | grep -E '^(src/|tests/)' || true); [ "${#pyfiles[@]}" -eq 0 ] || { .venv/bin/ruff format "${pyfiles[@]}"; .venv/bin/ruff check --fix "${pyfiles[@]}"; }
          validate(){ : >/tmp/full.log; set +e; .venv/bin/ruff check src tests >>/tmp/full.log 2>&1; a=$?; .venv/bin/pytest -q >>/tmp/full.log 2>&1; b=$?; if [ -f dashboard/bun.lock ] || [ -f dashboard/bun.lockb ]; then (cd dashboard && bun run test && bun run build) >>/tmp/full.log 2>&1; c=$?; else (cd dashboard && pnpm run test && pnpm run build) >>/tmp/full.log 2>&1; c=$?; fi; [ -f tests/guard_command_decision_diff.py ] && { .venv/bin/python tests/guard_command_decision_diff.py --write >>/tmp/full.log 2>&1; d=$?; .venv/bin/python tests/guard_command_decision_diff.py --check >>/tmp/full.log 2>&1; e=$?; } || { d=0;e=0; }; set -e; [ $a -eq 0 ]&&[ $b -eq 0 ]&&[ $c -eq 0 ]&&[ $d -eq 0 ]&&[ $e -eq 0 ]; }
          for n in 1 2 3 4; do validate && break; python /tmp/everyday_mode_safe_agent.py --surface core --mode repair --start 1 --end 740 --prd /tmp/everyday-specs/PRD.md --todo /tmp/everyday-specs/TODO.md --findings /tmp/full.log --max-turns 160; [ "$n" -lt 4 ] || { cat /tmp/full.log; exit 1; }; done
          git add -A; git commit -m 'fix(everyday): complete final release/3.2 verification' || true
          git fetch origin "$TARGET_BRANCH"; git rebase "origin/$TARGET_BRANCH" || { git diff --name-only --diff-filter=U >/tmp/rebase.txt; python /tmp/everyday_mode_safe_agent.py --surface core --mode repair --start 1 --end 740 --prd /tmp/everyday-specs/PRD.md --todo /tmp/everyday-specs/TODO.md --findings /tmp/rebase.txt --max-turns 140; git add -A; GIT_EDITOR=true git rebase --continue; validate; }
          git push --force-with-lease origin HEAD:"$DELIVERY_BRANCH"; sha="$(git rev-parse HEAD)"
          gh api -X POST "repos/hashgraph-online/hol-guard/statuses/$sha" -f state=success -f context='Everyday Mode verified delivery' -f description='Full verified EVM-001-740 delivery' >/dev/null
          gh pr edit 2629 --repo hashgraph-online/hol-guard --base "$TARGET_BRANCH" --title 'feat: complete Everyday Mode (EVM-001–740)' --body 'Complete authoritative Everyday Mode delivery on release/3.2, rebuilt cleanly from the target branch, reviewed against all conversations, stripped of temporary automation, and verified by full Core and dashboard tests.'
          export SHA="$sha"
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          rows=json.load(open('/tmp/threads.json')); token=os.environ['GITHUB_TOKEN']; changed=set(subprocess.check_output(['git','diff','--name-only','origin/release/3.2...HEAD'],text=True).splitlines())
          for t in rows:
            p=t.get('path') or ''
            if pathlib.Path(p).exists() and p not in changed: continue
            m='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{id isResolved}}}'; r=urllib.request.Request('https://api.github.com/graphql',data=json.dumps({'query':m,'variables':{'id':t['id']}}).encode(),method='POST',headers={'Authorization':f'Bearer {token}','Content-Type':'application/json','User-Agent':'everyday-core-v2'}); result=json.load(urllib.request.urlopen(r,timeout=60));
            if result.get('errors'): raise SystemExit(result['errors'])
          PY
          gh pr merge 2629 --repo hashgraph-online/hol-guard --squash --delete-branch
          gh pr view 2629 --repo hashgraph-online/hol-guard --json mergedAt --jq -e '.mergedAt != null' >/dev/null
