name: Rebuild Everyday foundation on 3.2
on:
  push:
    branches:
      - feat/everyday-mode-001-100-v32
permissions:
  contents: write
concurrency:
  group: rebuild-everyday-foundation-v32
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-001-100-v32
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed foundation delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/everyday-mode-001-100 release/3.2
          git diff --binary 784b31eb7b388e23b2a9e8cb4372c1d639049cbe..origin/feat/everyday-mode-001-100 -- \
            dashboard/package.json \
            dashboard/src/guard-types.ts \
            dashboard/src/main.tsx \
            dashboard/src/presentation-mode.test.ts \
            dashboard/src/presentation-mode.ts \
            dashboard/src/tailwind-root.css \
            docs/guard/adr/0012-everyday-and-technical-presentation.md \
            docs/guard/everyday-mode/copy-contract.md \
            docs/guard/everyday-mode/vocabulary.json \
            schemas/guard_action_explanation_v1.json \
            src/codex_plugin_scanner/guard/config.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            src/codex_plugin_scanner/guard/presentation_mode.py \
            src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py \
            src/codex_plugin_scanner/guard/schemas/guard_action_explanation_v1.json \
            tests/test_guard_action_explanation_contract.py \
            tests/test_guard_codex_browser_authority.py \
            tests/test_guard_presentation_mode.py \
            > /tmp/everyday-foundation.patch
          git apply --3way --index /tmp/everyday-foundation.patch
          git status --short
      - name: Refresh ratchets and evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/codex_plugin_scanner/guard
          if [ -f scripts/ci/test_inventory.py ]; then
            python scripts/ci/test_inventory.py --output /tmp/test-inventory.json || python scripts/ci/test_inventory.py > /tmp/test-inventory.json || true
          fi
          if [ -f tests/guard_command_decision_diff.py ]; then
            python tests/guard_command_decision_diff.py --write || true
          fi
      - name: Remove one-shot workflow
        run: git rm .github/workflows/tmp-rebuild-everyday-foundation-v32.yml
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "feat: Everyday Mode foundation on release 3.2"
          git push origin HEAD:feat/everyday-mode-001-100-v32
