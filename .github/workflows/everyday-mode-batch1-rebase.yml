name: Rebase Everyday Mode batch 1

on:
  push:
    branches:
      - tmp/everyday-mode-batch1-rebase-runner-20260825
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: everyday-mode-batch1-rebase-runner
  cancel-in-progress: false

jobs:
  rebase-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out staged patch
        uses: actions/checkout@v4
        with:
          ref: tmp/everyday-mode-batch1-rebase-runner-20260825
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/everyday-mode/batch1-part-*.b64 | base64 --decode | gzip --decompress > "$RUNNER_TEMP/everyday-mode-batch1.patch"
          test "$(wc -c < "$RUNNER_TEMP/everyday-mode-batch1.patch")" -eq 94631
      - name: Apply onto current release/3.0 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach f4d881ec9ae5c45e79b51539b079b5c3341a24b8
          git apply --index "$RUNNER_TEMP/everyday-mode-batch1.patch"
          git diff --cached --check
          python -m compileall -q src/codex_plugin_scanner/guard
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify Core and dashboard contracts
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync pytest -q tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py
          uv run --no-sync ruff check src/codex_plugin_scanner/guard/presentation_mode.py src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py
          cd dashboard
          bun install --frozen-lockfile
          bun run test -- presentation-mode.test.ts
          bun run build
          cd ..
          ! grep -qF '.isolate{' src/codex_plugin_scanner/guard/daemon/static/assets/index.css
      - name: Replace feature branch with verified rebased commit
        shell: bash
        env:
          EXPECTED_OLD_HEAD: c8b85ff1dcac8e705d93f407d474437cbfe26f8d
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --signoff -m 'feat: Everyday Mode foundation (EVM-001-100)'
          git push --force-with-lease=refs/heads/feat/everyday-mode-001-100:${EXPECTED_OLD_HEAD} origin HEAD:refs/heads/feat/everyday-mode-001-100
