name: Everyday Mode clean EVM 101-200 branch

on:
  push:
    branches:
      - feat/everyday-mode-101-200

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-101-200
          persist-credentials: true
      - name: Remove branch scaffolding
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/everyday-mode-clean-101-200.yml \
            docs/guard/everyday-mode/.batch-101-200-review-fixes \
            docs/guard/everyday-mode/semantic-coverage-201-300.md \
            docs/guard/everyday-mode/.batch-201-300-base \
            docs/guard/everyday-mode/.branch-201-300 \
            docs/guard/everyday-mode/.branch-201-300-ready \
            docs/guard/everyday-mode/.stack-marker \
            docs/guard/everyday-mode/.e201 \
            docs/guard/everyday-mode/.final-stack-point
          git commit -m "chore: remove Everyday Mode branch scaffolding"
          git push origin HEAD:feat/everyday-mode-101-200
