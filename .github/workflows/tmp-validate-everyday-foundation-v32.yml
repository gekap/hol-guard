name: Validate Everyday foundation v3.2
on:
  push:
    branches:
      - feat/everyday-mode-001-100-v32
permissions:
  contents: write
concurrency:
  group: validate-everyday-foundation-v32
  cancel-in-progress: false
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-001-100-v32
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - name: Preserve current dashboard scripts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('dashboard/package.json')
          data=json.loads(p.read_text())
          data['scripts']['test:managed-controls-ui']='tsx src/managed-controls/extension-managed-controls-panel.test.tsx && tsx src/managed-controls/local-protection-model.test.ts && tsx src/protection-center/protection-module-detail.test.tsx && tsx src/protection-center/extension-activity.test.tsx && tsx src/extension-policy-panel.managed-controls.test.ts && tsx src/extension-controls-normalize.test.ts'
          p.write_text(json.dumps(data, indent=2)+'\n')
          PY
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Backend focused validation
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff check src/codex_plugin_scanner/guard/presentation_mode.py src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py
          uv run --no-sync pytest -q tests/test_guard_presentation_mode.py tests/test_guard_action_explanation_contract.py tests/test_guard_codex_browser_authority.py
          uv run --no-sync python tests/guard_command_decision_diff.py --check
      - name: Dashboard validation
        shell: bash
        working-directory: dashboard
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec tsx src/presentation-mode.test.ts
          pnpm run test:managed-controls-ui
          pnpm run build
      - name: Structural gates
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json || uv run --no-sync python scripts/ci/test_inventory.py > /tmp/test-inventory.json
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/test-inventory.json
          uv run --no-sync python scripts/ci/code_quality_audit.py --root . --baseline ci/code-quality-baseline.json --json-output /tmp/code-quality.json
          git diff --check origin/release/3.2...HEAD
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-validate-everyday-foundation-v32.yml
          git add dashboard/package.json
          git commit -m "test: validate Everyday foundation on release 3.2"
          git push origin HEAD:feat/everyday-mode-001-100-v32
