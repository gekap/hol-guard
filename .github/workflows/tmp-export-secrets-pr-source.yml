name: Export exact secrets evidence PR source

on:
  push:
    branches:
      - feat/secrets-v2-evidence-contracts-final-v4
    paths:
      - .github/workflows/tmp-export-secrets-pr-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/secrets-v2-evidence-contracts-final-v4
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/head.txt"
          tar --exclude=.git --exclude=.venv --exclude=dashboard/node_modules --exclude='**/__pycache__' -czf "$RUNNER_TEMP/source.tar.gz" .
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-evidence-pr-source
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/head.txt
          if-no-files-found: error
          retention-days: 1
