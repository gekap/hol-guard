name: Rust authority batch 1 merge gate

on:
  push:
    branches: [fix/rust-authority-batch-1]
    paths:
      - ".github/workflows/rust-authority-batch1-merge-gate.yml"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  adversarial-review-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: "2602"
      BRANCH: fix/rust-authority-batch-1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-authority-batch-1
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for proven implementation commit
        run: |
          for attempt in $(seq 1 90); do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            if test -f rust/crates/guard-runtime/src/pretool.rs \
              && test -f scripts/ci/check_rust_pretool_authority.py \
              && test -f scripts/integration/rust_pretool_authority.py; then
              exit 0
            fi
            sleep 10
          done
          echo "The proven implementation commit did not arrive" >&2
          exit 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Independent source and compiler review
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          uv run --no-sync python scripts/ci/check_rust_pretool_authority.py
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          export HOL_GUARD_PACKAGE_VERSION="$VERSION"
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
      - name: Independent adversarial real-process review
        env:
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          uv run --no-sync python scripts/integration/rust_pretool_authority.py
          uv run --no-sync python scripts/integration/rust_pretool_adversarial.py
          uv run --no-sync python scripts/bench_guard_native_release_gate.py \
            --runtime "$HOL_GUARD_NATIVE_BINARY" \
            --warm-iterations 30 \
            --cold-iterations 2 \
            --json native-performance.json \
            --enforce
      - name: Record independent review
        run: |
          gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment --body \
            "Independent adversarial review completed against the compiled Rust runtime. Verified source authority, compiler and clippy gates, all-harness daemon ingress, destructive and uncertain command denial, malformed-wire rejection, transport fail-closed behavior, and native performance gates."
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@coderabbitai review"
      - name: Wait for latest-head CI and reviews
        run: |
          sleep 120
          for attempt in $(seq 1 120); do
            git fetch origin "$BRANCH"
            HEAD_SHA=$(git rev-parse "origin/$BRANCH")
            RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$HEAD_SHA" --limit 100 --json name,status,conclusion)
            FAILURES=$(jq '[.[] | select(.name != "Rust authority batch 1 merge gate") | select(.status == "completed") | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length' <<<"$RUNS")
            PENDING=$(jq '[.[] | select(.name != "Rust authority batch 1 merge gate") | select(.status != "completed")] | length' <<<"$RUNS")
            COUNT=$(jq '[.[] | select(.name != "Rust authority batch 1 merge gate")] | length' <<<"$RUNS")
            if test "$FAILURES" -gt 0; then
              jq . <<<"$RUNS"
              exit 1
            fi
            if test "$COUNT" -gt 0 && test "$PENDING" -eq 0; then
              break
            fi
            sleep 15
          done
          HEAD_SHA=$(git rev-parse "origin/$BRANCH")
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$HEAD_SHA" --limit 100 --json name,status,conclusion)
          test "$(jq '[.[] | select(.name != "Rust authority batch 1 merge gate") | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length' <<<"$RUNS")" -eq 0
          OWNER=${GITHUB_REPOSITORY%/*}
          REPO=${GITHUB_REPOSITORY#*/}
          UNRESOLVED=$(gh api graphql -f owner="$OWNER" -f repo="$REPO" -F number="$PR_NUMBER" -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          test "$UNRESOLVED" -eq 0
      - name: Merge reviewed batch 1
        run: |
          HEAD_SHA=$(git rev-parse "origin/$BRANCH")
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash \
            --match-head-commit "$HEAD_SHA" \
            --subject "feat(guard): make PreToolUse Rust authoritative" \
            --body "Completes Rust authority migration tasks T001-T100 with real-binary and adversarial integration proof."
