name: Rust PreToolUse authority retry dispatch

on:
  push:
    branches: [fix/rust-authority-batch-1]
    paths:
      - ".github/workflows/rust-pretool-authority-retry-dispatch.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch final retry on current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rust-authority-batch1-retry-merge.yml --repo hashgraph-online/hol-guard --ref fix/rust-authority-batch-1
