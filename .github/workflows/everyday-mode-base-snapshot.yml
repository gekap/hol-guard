name: Everyday Mode base source snapshot

on:
  push:
    branches:
      - tmp/everyday-mode-base-snapshot-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/everyday-mode-base-snapshot-20260825
          fetch-depth: 1
          persist-credentials: false
      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: everyday-mode-base-source-${{ github.sha }}
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
          if-no-files-found: error
