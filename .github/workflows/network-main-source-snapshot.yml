name: Network main source snapshot

on:
  push:
    branches:
      - chore/network-main-snapshot-20260825

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Archive source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.venv --exclude=.uv-cache -czf "$RUNNER_TEMP/hol-guard-main.tar.gz" .
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hol-guard-main-source
          path: ${{ runner.temp }}/hol-guard-main.tar.gz
          if-no-files-found: error
          retention-days: 1
