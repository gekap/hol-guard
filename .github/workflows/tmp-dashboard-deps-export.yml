name: Export dashboard dependencies for local Everyday Mode validation

on:
  push:
    branches:
      - tmp/everyday-base-export-20260828

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.6'
      - name: Install immutable dashboard dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile
      - name: Archive dependencies
        working-directory: dashboard
        run: tar -czf "$RUNNER_TEMP/dashboard-node-modules.tar.gz" node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hol-guard-dashboard-node-modules-${{ github.sha }}
          path: ${{ runner.temp }}/dashboard-node-modules.tar.gz
          retention-days: 1
          if-no-files-found: error
