name: Repair Fleet Extension reader classification

on:
  push:
    branches:
      - feat/fec-001-100-r32-remediation
    paths:
      - .github/workflows/fec-fix-contract-reader.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip-fec-materialize]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
      - name: Patch reader classification
        shell: bash
        env:
          PATCH_SCRIPT_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > "$RUNNER_TEMP/fec_patch.py"
          python "$RUNNER_TEMP/fec_patch.py"
          git rm .github/workflows/fec-fix-contract-reader.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/codex_plugin_scanner/guard/managed_controls/fleet_contracts.py
          git commit -m 'fix(guard): preserve stable Fleet Extension reasons [skip-fec-materialize]'
          git push origin HEAD:${GITHUB_REF_NAME}
