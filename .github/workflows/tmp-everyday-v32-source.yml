name: Everyday v3.2 source snapshot
on:
  push:
    branches:
      - tmp/everyday-v32-source
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/everyday-v32-source
          fetch-depth: 1
          persist-credentials: false
      - run: git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: everyday-v32-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
          if-no-files-found: error
