name: Network local source bootstrap

on:
  push:
    branches:
      - fix/network-isolation-remediation-rem121-139

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package reviewed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/SOURCE_HEAD
          tar --exclude=.git --exclude=.venv --exclude=node_modules --exclude=dist --exclude=build -czf /tmp/hol-guard-source.tgz .
          sha256sum /tmp/hol-guard-source.tgz > /tmp/hol-guard-source.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: network-local-source
          path: |
            /tmp/hol-guard-source.tgz
            /tmp/hol-guard-source.tgz.sha256
            /tmp/SOURCE_HEAD
          if-no-files-found: error
          retention-days: 1
