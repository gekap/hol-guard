name: Finish PR 2569 v3

on:
  push:
    branches:
      - tmp/finish-pr2569-20260826-v1
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: finish-pr2569-v3
  cancel-in-progress: false

jobs:
  integrate-verify-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out orchestration branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/finish-pr2569-20260826-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile current release branch
        id: integrate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin release/3.0 feat/everyday-mode-001-100
          expected_head="$(git rev-parse origin/feat/everyday-mode-001-100)"
          echo "expected_head=$expected_head" >> "$GITHUB_OUTPUT"
          git checkout -B feat/everyday-mode-001-100 origin/feat/everyday-mode-001-100

          set +e
          git merge --no-commit --no-ff origin/release/3.0
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          if ((${#conflicts[@]})); then
            printf 'Conflicts detected:\n%s\n' "${conflicts[*]}"
            unexpected=()
            for path in "${conflicts[@]}"; do
              case "$path" in
                ci/test-suite-ratchet-baseline.json)
                  python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          path = "ci/test-suite-ratchet-baseline.json"

          def stage(number: int) -> dict[str, int]:
              raw = subprocess.check_output(["git", "show", f":{number}:{path}"], text=True)
              data = json.loads(raw)
              if not isinstance(data, dict):
                  raise TypeError(f"{path} must contain an object")
              return {str(key): int(value) for key, value in data.items()}

          ancestor = stage(1)
          feature = stage(2)
          release = stage(3)
          merged: dict[str, int] = {}
          for key in sorted(set(ancestor) | set(feature) | set(release)):
              if key == "schema_version":
                  merged[key] = max(ancestor.get(key, 1), feature.get(key, 1), release.get(key, 1))
                  continue
              baseline = ancestor.get(key, 0)
              feature_delta = max(0, feature.get(key, baseline) - baseline)
              release_delta = max(0, release.get(key, baseline) - baseline)
              merged[key] = baseline + feature_delta + release_delta
          Path(path).write_text(json.dumps(merged, indent=2) + "\n", encoding="utf-8")
          PY
                  git add "$path"
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if ((${#unexpected[@]})); then
              printf 'Unexpected unresolved conflicts:\n%s\n' "${unexpected[*]}"
              exit 1
            fi
          elif ((merge_status != 0)); then
            echo 'Merge failed without an inspectable conflict set.'
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          types_path = Path("dashboard/src/guard-types.ts")
          text = types_path.read_text(encoding="utf-8")
          required = """  presentation_mode: GuardPresentationMode;
            presentation_mode_explicit: boolean;
            presentation_schema_version: number;
            presentation_revision: number;
          """.replace("    ", "")
          optional = """  presentation_mode?: GuardPresentationMode;
            presentation_mode_explicit?: boolean;
            presentation_schema_version?: number;
            presentation_revision?: number;
          """.replace("    ", "")
          if required in text:
              text = text.replace(required, optional, 1)
              types_path.write_text(text, encoding="utf-8")
          elif optional not in text:
              raise SystemExit("GuardSettings presentation fields no longer match expected source")

          mode = Path("dashboard/src/presentation-mode.ts").read_text(encoding="utf-8")
          required_fragments = (
              'if (persistedMode !== null && input.explicit === true)',
              'return resolved(input.cloudProfile, "cloud-profile", false)',
              'if (persistedMode !== null)',
          )
          for fragment in required_fragments:
              if fragment not in mode:
                  raise SystemExit(f"Reviewed presentation precedence fix missing: {fragment}")
          PY

          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --check
          git status --short

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --extra dev --python 3.12

      - name: Run focused formatting, lint, type, and contract gates
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/config.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            src/codex_plugin_scanner/guard/presentation_mode.py \
            src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py \
            tests/test_guard_action_explanation_contract.py \
            tests/test_guard_codex_browser_authority.py \
            tests/test_guard_presentation_mode.py
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/config.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            src/codex_plugin_scanner/guard/presentation_mode.py \
            src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py \
            tests/test_guard_action_explanation_contract.py \
            tests/test_guard_codex_browser_authority.py \
            tests/test_guard_presentation_mode.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/presentation_mode.py \
            src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py
          uv run --no-sync python -m compileall -q src/codex_plugin_scanner/guard

      - name: Run adversarial schema and trust-boundary review
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_guard_presentation_mode.py \
            tests/test_guard_action_explanation_contract.py \
            tests/test_guard_codex_browser_authority.py
          uv run --no-sync python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          from copy import deepcopy
          from pathlib import Path

          from codex_plugin_scanner.guard.runtime.action_explanation_contract import (
              explanation_identity_matches,
              parse_action_explanation,
          )
          from tests.test_guard_action_explanation_contract import _explanation

          public_schema = json.loads(Path("schemas/guard_action_explanation_v1.json").read_text(encoding="utf-8"))
          packaged_schema = json.loads(
              Path("src/codex_plugin_scanner/guard/schemas/guard_action_explanation_v1.json").read_text(encoding="utf-8")
          )
          assert public_schema == packaged_schema

          valid = _explanation().to_dict()
          parsed = parse_action_explanation(valid)
          assert explanation_identity_matches(
              parsed,
              action_identity="action:1",
              canonical_identity="command:v1:abc",
          )
          unbound = deepcopy(valid)
          unbound["canonical_identity"] = None
          assert not explanation_identity_matches(
              parse_action_explanation(unbound),
              action_identity="action:1",
              canonical_identity="command:v1:abc",
          )

          mutations = (
              lambda payload: payload.pop("everyday"),
              lambda payload: payload["everyday"].pop("headline"),
              lambda payload: payload["everyday"].update({"unexpected": True}),
              lambda payload: payload["technical"].update({"available": "true"}),
              lambda payload: payload["redaction"].update({"omitted_fields": [7]}),
              lambda payload: payload["everyday"].update({"summary": "x" * 1001}),
          )
          for mutate in mutations:
              candidate = deepcopy(valid)
              mutate(candidate)
              try:
                  parse_action_explanation(candidate)
              except ValueError:
                  pass
              else:
                  raise AssertionError("schema-invalid explanation crossed the trust boundary")

          forbidden = {"requests", "httpx", "urllib", "openai", "anthropic", "subprocess", "socket"}
          for path in (
              Path("src/codex_plugin_scanner/guard/presentation_mode.py"),
              Path("src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py"),
          ):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              imported = {
                  alias.name.split(".")[0]
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Import)
                  for alias in node.names
              }
              imported.update(
                  (node.module or "").split(".")[0]
                  for node in ast.walk(tree)
                  if isinstance(node, ast.ImportFrom)
              )
              assert not forbidden.intersection(imported), (path, forbidden.intersection(imported))
          PY

      - name: Run dashboard tests, build, and TypeScript delta gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --global bun@1.2.22
          cd dashboard
          bun install --frozen-lockfile
          bun run test
          bun run build
          set +e
          bun x tsc --noEmit --pretty false > "$RUNNER_TEMP/candidate-tsc.txt" 2>&1
          candidate_status=$?
          set -e
          cd ..

          git worktree add --detach "$RUNNER_TEMP/release-baseline" origin/release/3.0
          cd "$RUNNER_TEMP/release-baseline/dashboard"
          bun install --frozen-lockfile
          set +e
          bun x tsc --noEmit --pretty false > "$RUNNER_TEMP/release-tsc.txt" 2>&1
          release_status=$?
          set -e
          cd "$GITHUB_WORKSPACE"

          CANDIDATE_STATUS="$candidate_status" RELEASE_STATUS="$release_status" python - <<'PY'
          from collections import Counter
          import os
          from pathlib import Path
          import re

          location = re.compile(r"\(\d+,\d+\)")

          def diagnostics(path: str) -> Counter[str]:
              lines = Path(path).read_text(encoding="utf-8", errors="replace").splitlines()
              normalized: Counter[str] = Counter()
              for line in lines:
                  if "error TS" not in line:
                      continue
                  normalized[location.sub("(<loc>)", line)] += 1
              return normalized

          candidate = diagnostics(os.path.join(os.environ["RUNNER_TEMP"], "candidate-tsc.txt"))
          release = diagnostics(os.path.join(os.environ["RUNNER_TEMP"], "release-tsc.txt"))
          extra = candidate - release
          print("Candidate tsc status:", os.environ["CANDIDATE_STATUS"])
          print("Release baseline tsc status:", os.environ["RELEASE_STATUS"])
          if extra:
              print("New TypeScript diagnostics introduced by PR 2569:")
              for diagnostic, count in extra.items():
                  print(f"{count}x {diagnostic}")
              raise SystemExit(1)
          PY
          git diff --check

      - name: Run repository regression and ratchet gates
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output code-quality-audit.json

      - name: Verify installed wheel contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist "$RUNNER_TEMP/pr2569-wheel-venv"
          uv build --wheel
          uv venv "$RUNNER_TEMP/pr2569-wheel-venv"
          uv pip install --python "$RUNNER_TEMP/pr2569-wheel-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/pr2569-wheel-venv/bin/python" - <<'PY'
          from codex_plugin_scanner.guard.presentation_mode import resolve_presentation_mode
          from codex_plugin_scanner.guard.runtime.action_explanation_contract import parse_action_explanation

          resolved = resolve_presentation_mode()
          assert resolved.value == "everyday"
          assert resolved.schema_version == 1
          assert callable(parse_action_explanation)
          PY

      - name: Commit and push exact verified integration
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.integrate.outputs.expected_head }}
        run: |
          set -euo pipefail
          rm -f test-inventory.json code-quality-audit.json
          rm -rf dist
          git add -A
          if git diff --cached --name-only | grep -E '^\.github/workflows/tmp-' ; then
            echo 'Temporary orchestration workflow leaked into the feature branch.'
            exit 1
          fi
          git diff --cached --check
          git commit -s -m 'chore(everyday): reconcile foundation with release/3.0'
          git push --force-with-lease="refs/heads/feat/everyday-mode-001-100:${EXPECTED_HEAD}" \
            origin HEAD:refs/heads/feat/everyday-mode-001-100
