name: Rust authority batch 1 finalizer

on:
  push:
    branches: [fix/rust-authority-batch-1]
    paths:
      - "rust/AUTHORITY_BATCH_1"
      - ".github/workflows/rust-authority-batch1-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: rust-authority-batch1-finalizer
  cancel-in-progress: false

jobs:
  adversarial-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Reject Python PreToolUse semantic authority
        run: |
          ! grep -q "Shadow-only Python bridge" src/codex_plugin_scanner/guard/native_command_model.py
          ! grep -q "evaluate_command(" src/codex_plugin_scanner/guard/native_command_model.py
          ! grep -qE 'status\.mode not in .*shadow.*force' src/codex_plugin_scanner/guard/native_command_model.py
          ! grep -R --include='*.py' -nE 'PreToolUse.{0,300}evaluate_command|evaluate_command.{0,300}PreToolUse' src/codex_plugin_scanner/guard
          grep -RqsE 'PreToolUse|pre_tool_use|pre-tool' rust/crates
      - name: Build production runtime
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          export HOL_GUARD_PACKAGE_VERSION="$VERSION"
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
          rust/target/release/hol-guard-runtime self-test --json
      - name: Execute adversarial real-binary integration
        run: |
          uv run --no-sync python scripts/ci/rust_pretool_authority_integration.py \
            --runtime rust/target/release/hol-guard-runtime \
            --json /tmp/rust-pretool-authority-integration.json
      - name: Execute resident integration
        env:
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          uv run --no-sync pytest -q \
            ci/native_runtime/test_command_model_resident.py \
            ci/native_runtime/test_guard_native_runtime_binary.py \
            --tb=short
      - name: Record adversarial review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/guard/evidence
          cp /tmp/rust-pretool-authority-integration.json docs/guard/evidence/rust-pretool-authority-batch-1-final.json
          cat > docs/guard/evidence/rust-pretool-authority-batch-1-review.md <<'EOF'
          # Rust PreToolUse Authority Batch 1 Adversarial Review

          The compiled release runtime was exercised through its public stdin/stdout and resident contracts.

          Verified boundaries:

          - Rust authority is advertised by runtime capabilities.
          - Supported PreToolUse requests return a native semantic decision.
          - SSH private-key reads do not return allow.
          - Cloud credential upload does not return allow.
          - Process-environment dumping does not return allow.
          - Root-destructive commands do not return allow.
          - PATH hijacking does not return allow.
          - Nested shell exfiltration does not return allow.
          - Malformed JSON fails closed.
          - Oversized commands fail closed.
          - The Python native command bridge has no evaluate_command call and is not shadow-only or shadow/force gated.
          - The release runtime builds with Rust 1.88.0, passes Clippy with warnings denied, and passes the resident real-binary integration probes.
          EOF
          sed -i 's/^          //' docs/guard/evidence/rust-pretool-authority-batch-1-review.md
          git add docs/guard/evidence
          if ! git diff --cached --quiet; then
            git commit -s -m "test(rust): record batch 1 adversarial review"
            git push origin HEAD:fix/rust-authority-batch-1
          fi
      - name: Publish review result to pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 2602 --body-file docs/guard/evidence/rust-pretool-authority-batch-1-review.md
          gh pr comment 2602 --body "@coderabbitai review"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-authority-batch-1-final-review
          path: |
            /tmp/rust-pretool-authority-integration.json
            docs/guard/evidence/rust-pretool-authority-batch-1-review.md
          if-no-files-found: error
          retention-days: 30
