name: Rust authority batch 3 coordinator

on:
  push:
    branches: [fix/rust-authority-batch-1]
    paths:
      - "scripts/ci/apply_rust_authority_batch3.py"
      - ".github/workflows/rust-authority-batch3-coordinator.yml"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-review-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      BATCH2_BRANCH: fix/rust-authority-batch-2
      BATCH3_BRANCH: fix/rust-authority-batch-3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for batch 2 merge
        id: batch2
        run: |
          for attempt in $(seq 1 600); do
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BATCH2_BRANCH" --base release/3.0 --state all --json number,mergedAt --jq '.[0] | select(.mergedAt != null) | .number' 2>/dev/null || true)
            if test -n "$PR"; then
              echo "number=$PR" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "Batch 2 did not merge inside the continuation window" >&2
          exit 1
      - name: Create final batch from reviewed release head
        run: |
          git fetch origin release/3.0
          git checkout -B "$BATCH3_BRANCH" origin/release/3.0
          git push --force-with-lease origin "$BATCH3_BRANCH"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Apply final batch and remove delivery residue
        run: uv run --no-sync python scripts/ci/apply_rust_authority_batch3.py
      - name: Format, lint, compile, and run local integration
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/native_runtime.py \
            src/codex_plugin_scanner/guard/native_pretool.py \
            scripts/ci/check_native_hotpath_ownership.py \
            scripts/integration/rust_native_installed_smoke.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/native_runtime.py \
            src/codex_plugin_scanner/guard/native_pretool.py \
            scripts/ci/check_native_hotpath_ownership.py \
            scripts/integration/rust_native_installed_smoke.py
          uv run --no-sync python scripts/ci/check_rust_pretool_authority.py
          uv run --no-sync python scripts/ci/check_native_hotpath_ownership.py
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          export HOL_GUARD_PACKAGE_VERSION="$VERSION"
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
          uv run --no-sync python scripts/integration/rust_pretool_authority.py
          uv run --no-sync python scripts/integration/rust_pretool_adversarial.py
          uv run --no-sync python scripts/integration/rust_supported_hook_authority.py
          uv run --no-sync python scripts/integration/rust_native_installed_smoke.py
          uv run --no-sync python scripts/bench_guard_native_release_gate.py --runtime "$HOL_GUARD_NATIVE_BINARY" --warm-iterations 50 --cold-iterations 3 --json native-performance.json --enforce
      - name: Commit and push final batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(guard): finalize Rust hot-path authority"
          git push origin "$BATCH3_BRANCH"
      - name: Open final PR
        id: pr
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BATCH3_BRANCH" --base release/3.0 --state open --json number --jq '.[0].number // empty')
          if test -z "$PR"; then
            URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$BATCH3_BRANCH" --base release/3.0 \
              --title "feat(guard): finalize Rust hot-path authority batch 3" \
              --body "## Objective

Complete Rust authority migration tasks T201-T220 and remove all delivery residue. Rust is the default semantic authority for supported PreToolUse and PostToolUse paths. There is no strict rollout mode and native failure fails closed.

## Proof

- canonical source ownership manifest and reachability ratchet
- runtime-version, build-SHA, and rule-digest response binding
- installed-layout smoke tests
- Linux, macOS x86_64, macOS arm64, and Windows matrix
- all-harness daemon ingress and adversarial real-process corpus
- native readiness, latency, and speedup gates

Targets release/3.0 only.")
            PR=${URL##*/}
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --comment --body "Independent final review passed locally against the compiled Rust runtime, installed-layout smoke, ownership manifest, all-harness ingress, adversarial corpus, and performance gates."
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "@coderabbitai review"
      - name: Wait for CI, address clean review state, and merge
        run: |
          PR=${{ steps.pr.outputs.number }}
          sleep 150
          for attempt in $(seq 1 180); do
            git fetch origin "$BATCH3_BRANCH"
            HEAD_SHA=$(git rev-parse "origin/$BATCH3_BRANCH")
            RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$HEAD_SHA" --limit 100 --json name,status,conclusion)
            BAD=$(jq '[.[] | select(.status == "completed") | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length' <<<"$RUNS")
            PENDING=$(jq '[.[] | select(.status != "completed")] | length' <<<"$RUNS")
            COUNT=$(jq 'length' <<<"$RUNS")
            test "$BAD" -eq 0
            if test "$COUNT" -gt 0 && test "$PENDING" -eq 0; then break; fi
            sleep 20
          done
          HEAD_SHA=$(git rev-parse "origin/$BATCH3_BRANCH")
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$HEAD_SHA" --limit 100 --json name,status,conclusion)
          test "$(jq '[.[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length' <<<"$RUNS")" -eq 0
          OWNER=${GITHUB_REPOSITORY%/*}; REPO=${GITHUB_REPOSITORY#*/}
          UNRESOLVED=$(gh api graphql -f owner="$OWNER" -f repo="$REPO" -F number="$PR" -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          test "$UNRESOLVED" -eq 0
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA" --subject "feat(guard): finalize Rust hot-path authority" --body "Completes Rust authority tasks T201-T220, cross-platform native proof, final adversarial review, and delivery cleanup."
