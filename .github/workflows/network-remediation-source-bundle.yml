name: Network remediation source bundle

on:
  push:
    branches:
      - chore/network-remediation-main-sync-r0-20260824
  pull_request:
    branches:
      - release/3.0
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out integration source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive source
        run: tar --exclude=.git --exclude=.venv -czf "$RUNNER_TEMP/hol-guard-network-remediation-source.tgz" .
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hol-guard-network-remediation-source
          path: ${{ runner.temp }}/hol-guard-network-remediation-source.tgz
          if-no-files-found: error
          retention-days: 1

  release-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: release/3.0
          fetch-depth: 1
          persist-credentials: false
      - name: Archive baseline
        run: tar --exclude=.git --exclude=.venv -czf "$RUNNER_TEMP/hol-guard-network-remediation-release-baseline.tgz" .
      - name: Upload baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hol-guard-network-remediation-release-baseline
          path: ${{ runner.temp }}/hol-guard-network-remediation-release-baseline.tgz
          if-no-files-found: error
          retention-days: 1
