name: Materialize Fleet Extension fixtures

on:
  push:
    branches:
      - feat/fec-001-100-r32-remediation
    paths:
      - .github/workflows/fec-materialize-contract-fixtures.yml

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[skip-fec-materialize]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
      - name: Write exact cross-repository fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          cases = [
              {
                  "contract": "fleetExtensionConfiguration",
                  "expectedError": "fec_unknown_field",
                  "id": "unknown-top-level",
                  "patch": {"unexpected": True},
              },
              {
                  "contract": "fleetExtensionConfiguration",
                  "expectedError": "fec_unknown_field",
                  "id": "unknown-nested-target",
                  "mutation": {
                      "key": "sourcePath",
                      "path": ["entries", 0, "target"],
                      "type": "nested-add",
                      "value": "/private/path",
                  },
              },
              {
                  "contract": "fleetExtensionConfiguration",
                  "expectedError": "fec_managed_weaken_forbidden",
                  "id": "managed-permit",
                  "replace": {
                      "entries": [
                          {
                              "authorityMode": "managed-restrictive",
                              "availability": "enabled",
                              "contextualOutcome": "permit",
                              "entryId": "entry.bad",
                              "source": "explicit",
                              "target": {
                                  "extensionId": "command.shell",
                                  "kind": "extension",
                              },
                          }
                      ]
                  },
              },
              {
                  "contract": "fleetExtensionConfiguration",
                  "expectedError": "fec_managed_weaken_forbidden",
                  "id": "managed-custom-extension",
                  "replace": {
                      "entries": [
                          {
                              "authorityMode": "managed-restrictive",
                              "availability": "disabled",
                              "contextualOutcome": "block",
                              "entryId": "entry.custom.bad",
                              "source": "explicit",
                              "target": {
                                  "definitionId": "ced_01j5example00000001",
                                  "kind": "custom-extension",
                              },
                          }
                      ]
                  },
              },
              {
                  "contract": "fleetExtensionConfiguration",
                  "duplicatePath": "entries[0]",
                  "expectedError": "fec_duplicate_entry",
                  "id": "duplicate-entry",
              },
              {
                  "contract": "fleetExtensionConfiguration",
                  "expectedError": "fec_missing_field",
                  "id": "missing-name",
                  "removePath": ["name"],
              },
              {
                  "contract": "fleetExtensionConfiguration",
                  "expectedError": "fec_invalid_timestamp",
                  "id": "offset-timestamp",
                  "replace": {"createdAt": "2026-08-27T12:00:00+00:00"},
              },
              {
                  "contract": "fleetExtensionConfiguration",
                  "expectedError": "fec_limit_exceeded",
                  "id": "utf8-description-overflow",
                  "replace": {"description": "🧪" * 294},
              },
              {
                  "contract": "assignment",
                  "expectedError": "fec_conflicting_entry",
                  "id": "assignment-no-future-enrollment",
                  "replace": {"continuousEnrollment": False},
              },
              {
                  "contract": "assignment",
                  "expectedError": "fec_conflicting_entry",
                  "id": "assignment-selector-conflict",
                  "replace": {
                      "selector": {
                          "deviceIds": ["device.alpha"],
                          "memberIds": ["member.alpha"],
                          "mode": "selected-members",
                      }
                  },
              },
              {
                  "contract": "assignment",
                  "expectedError": "fec_assignment_empty",
                  "id": "assignment-selector-empty",
                  "replace": {
                      "selector": {"memberIds": [], "mode": "selected-members"}
                  },
              },
              {
                  "contract": "customExtensionDefinition",
                  "expectedError": "fec_missing_field",
                  "id": "custom-unreviewed-trusted",
                  "mutation": {
                      "path": ["variants", 0],
                      "type": "nested-replace",
                      "value": {
                          "identityEvidenceDigest": "sha256:" + "4" * 64,
                          "platforms": ["linux"],
                          "reviewState": "trusted",
                          "semanticFingerprint": "sha256:" + "3" * 64,
                          "variantId": "cev_01j5example00000001",
                      },
                  },
              },
              {
                  "contract": "customExtensionDefinition",
                  "expectedError": "fec_unknown_field",
                  "id": "custom-raw-path",
                  "patch": {"sourcePath": "/Users/example/tool"},
              },
              {
                  "contract": "customExtensionConfiguration",
                  "expectedError": "fec_limit_exceeded",
                  "id": "custom-empty-variants",
                  "replace": {"allowedVariantIds": []},
              },
              {
                  "contract": "customExtensionConfiguration",
                  "expectedError": "fec_conflicting_entry",
                  "id": "custom-invalid-binding",
                  "replace": {"bindingMode": "best-effort"},
              },
              {
                  "contract": "catalogSemantics",
                  "duplicatePath": "extensions[0]",
                  "expectedError": "fec_duplicate_entry",
                  "id": "catalog-duplicate-extension",
              },
              {
                  "contract": "catalogSemantics",
                  "expectedError": "fec_unsupported_capability",
                  "id": "unsupported-schema",
                  "replace": {
                      "schemaVersion": "guard.catalog-semantic-fingerprint.v9"
                  },
              },
          ]
          payload = (
              json.dumps(
                  {
                      "cases": cases,
                      "schemaVersion": "guard.managed-controls.adversarial-fixtures.v2",
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n"
          ).encode("utf-8")
          assert len(payload) == 6226
          assert hashlib.sha256(payload).hexdigest() == "e6a1059575e70218bbcdc2f7c80f35202b4919f2b581c18f8092522111c55b0d"
          destinations = [
              Path("contracts/managed-controls/v2/adversarial-fixtures.json"),
              Path(
                  "src/codex_plugin_scanner/guard/managed_controls/contracts/v2/adversarial-fixtures.json"
              ),
          ]
          for destination in destinations:
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(payload)
          PY
          rm -f docs/guard/fec-materializer-proof.md
          git rm .github/workflows/fec-materialize-contract-fixtures.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/managed-controls/v2/adversarial-fixtures.json \
            src/codex_plugin_scanner/guard/managed_controls/contracts/v2/adversarial-fixtures.json \
            docs/guard/fec-materializer-proof.md
          git commit -m 'test(guard): add exact Fleet Extension adversarial fixtures [skip-fec-materialize]'
          git push origin HEAD:${GITHUB_REF_NAME}
