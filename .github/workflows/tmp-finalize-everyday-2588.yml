name: Finalize Everyday Mode EVM 101-200

on:
  push:
    branches:
      - feat/everyday-mode-101-200

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-101-200
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.6'
      - name: Rebuild on release 3.0 and remediate reviews
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release/3.0 feat/everyday-mode-101-200
          SOURCE=7479a1023a589bdeb12696e13b1a3cb1f68b8960
          git checkout -B feat/everyday-mode-101-200 origin/release/3.0
          git checkout "$SOURCE" -- dashboard/src/action-explanation.test.tsx dashboard/src/action-explanation.tsx dashboard/src/main.tsx dashboard/src/presentation-mode-provider.tsx docs/guard/everyday-mode/action-explanation-runtime.md docs/guard/everyday-mode/extension-explanation-metadata.md docs/guard/everyday-mode/semantic-explanation-catalog.md src/codex_plugin_scanner/guard/runtime/action_explanation_builder.py src/codex_plugin_scanner/guard/runtime/command_extension_explanations.py src/codex_plugin_scanner/guard/runtime/semantic_explanations.py tests/test_guard_action_explanation_builder.py tests/test_guard_command_extension_explanations.py tests/test_guard_semantic_explanations.py
          python - <<'PY'
          from pathlib import Path

          p = Path('src/codex_plugin_scanner/guard/runtime/semantic_explanations.py')
          s = p.read_text()
          s = s.replace(
              'frozenset({"-d", "--data", "--data-binary", "--form", "--upload-file", "--body", "-infile"})',
              'frozenset({"-d", "--data", "--data-binary", "--form", "-F", "--upload-file", "-T", "--body", "-infile"})',
          )
          s = s.replace(
              '            return _bounded(match.group(1).strip("[]"), 253)',
              '            authority = match.group(1)\n            if authority.startswith("["):\n                closing = authority.find("]")\n                authority = authority[1:closing] if closing > 0 else authority.lstrip("[")\n            elif authority.count(":") == 1:\n                authority = authority.rsplit(":", 1)[0]\n            return _bounded(authority, 253)',
          )
          p.write_text(s)

          p = Path('src/codex_plugin_scanner/guard/runtime/action_explanation_builder.py')
          s = p.read_text()
          s = s.replace(
              'ACTION_EXPLANATION_REDACTION_VERSION,\n    ACTION_EXPLANATION_RENDERER_VERSION,',
              'ACTION_EXPLANATION_REDACTION_VERSION,\n    ACTION_EXPLANATION_RENDERER_VERSION,\n    ACTION_EXPLANATION_SCHEMA_VERSION,\n    ACTION_EXPLANATION_VERSION,',
          )
          s = s.replace(
              '"schema_version": "guard.action-explanation.v1",\n        "explanation_version": "1.0.0",',
              '"schema_version": ACTION_EXPLANATION_SCHEMA_VERSION,\n        "explanation_version": ACTION_EXPLANATION_VERSION,',
          )
          s = s.replace('            operands=tuple(segment.arguments),', '            operands=(),')
          p.write_text(s)
          PY
          rm -f .github/workflows/everyday-mode-source-export-2588.yml .github/workflows/tmp-finalize-everyday-2588.yml
      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv pip install 'ruff==0.15.17' 'pytest==9.0.3'
          .venv/bin/ruff format src/codex_plugin_scanner/guard/runtime/action_explanation_builder.py src/codex_plugin_scanner/guard/runtime/command_extension_explanations.py src/codex_plugin_scanner/guard/runtime/semantic_explanations.py tests/test_guard_action_explanation_builder.py tests/test_guard_command_extension_explanations.py tests/test_guard_semantic_explanations.py
          .venv/bin/ruff check --fix src/codex_plugin_scanner/guard/runtime/action_explanation_builder.py src/codex_plugin_scanner/guard/runtime/command_extension_explanations.py src/codex_plugin_scanner/guard/runtime/semantic_explanations.py tests/test_guard_action_explanation_builder.py tests/test_guard_command_extension_explanations.py tests/test_guard_semantic_explanations.py
          .venv/bin/ruff check src/codex_plugin_scanner/guard/runtime/action_explanation_builder.py src/codex_plugin_scanner/guard/runtime/command_extension_explanations.py src/codex_plugin_scanner/guard/runtime/semantic_explanations.py tests/test_guard_action_explanation_builder.py tests/test_guard_command_extension_explanations.py tests/test_guard_semantic_explanations.py
          .venv/bin/pytest -q tests/test_guard_action_explanation_contract.py tests/test_guard_action_explanation_projection.py tests/test_guard_action_explanation_builder.py tests/test_guard_command_extension_explanations.py tests/test_guard_semantic_explanations.py
          cd dashboard
          bun install --frozen-lockfile
          bun src/presentation-mode.test.ts
          bun src/action-explanation.test.tsx
          bun run build
      - name: Commit final branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'feat: finalize deterministic Everyday semantics (EVM-101-200)'
          git push --force origin HEAD:feat/everyday-mode-101-200
