name: Rebuild, validate, and merge Everyday Mode Core PR 2629

on:
  push:
    branches:
      - automation/rebuild-everyday-core-2629

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: write

concurrency:
  group: rebuild-everyday-core-2629
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/everyday-mode-001-100-final
      SOURCE_SHA: b0ec726dfe29dc0c1e463fcf50d3f6a3c7165789
      PR_NUMBER: '2629'
    steps:
      - name: Check out controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/rebuild-everyday-core-2629
          fetch-depth: 0
          persist-credentials: true
      - name: Construct clean release/3.2 head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release/3.2 "$TARGET_BRANCH"
          expected_head="$(git rev-parse "origin/$TARGET_BRANCH")"
          printf '%s\n' "$expected_head" > /tmp/expected-head
          git checkout -B rebuilt origin/release/3.2
          paths=(
            dashboard/package.json
            dashboard/src/guard-types.ts
            dashboard/src/main.tsx
            dashboard/src/presentation-mode.test.ts
            dashboard/src/presentation-mode.ts
            dashboard/src/tailwind-root.css
            docs/guard/adr/0012-everyday-and-technical-presentation.md
            docs/guard/everyday-mode/copy-contract.md
            docs/guard/everyday-mode/vocabulary.json
            schemas/guard_action_explanation_v1.json
            src/codex_plugin_scanner/guard/config.py
            src/codex_plugin_scanner/guard/daemon/server.py
            src/codex_plugin_scanner/guard/presentation_mode.py
            src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py
            src/codex_plugin_scanner/guard/schemas/guard_action_explanation_v1.json
            tests/test_guard_action_explanation_contract.py
            tests/test_guard_codex_browser_authority.py
            tests/test_guard_presentation_mode.py
          )
          printf '%s\n' "${paths[@]}" > /tmp/validated-product-paths
          for path in "${paths[@]}"; do
            git cat-file -e "$SOURCE_SHA:$path"
            git checkout "$SOURCE_SHA" -- "$path"
          done
          rm -f \
            .github/scripts/pr_review_fix_agent.py \
            .github/workflows/everyday-mode-finalize-2629.yml \
            .github/workflows/everyday-mode-finalize-2629-v2.yml \
            .github/workflows/everyday-mode-finalize-2629-v3.yml \
            .github/workflows/everyday-mode-finalize-2629-v4.yml \
            .github/workflows/everyday-mode-finalize-2629-v5.yml \
            .github/workflows/everyday-mode-release-32-finalize.yml \
            .github/workflows/everyday-mode-source-export-2629.yml \
            .github/workflows/pr-2629-review-fix.yml \
            .github/workflows/pr-2629-review-fix-v2.yml
          git add -A
          git diff --cached --check
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - name: Validate Core contracts
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/config.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            src/codex_plugin_scanner/guard/presentation_mode.py \
            src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py \
            tests/test_guard_action_explanation_contract.py \
            tests/test_guard_codex_browser_authority.py \
            tests/test_guard_presentation_mode.py
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/config.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            src/codex_plugin_scanner/guard/presentation_mode.py \
            src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py \
            tests/test_guard_action_explanation_contract.py \
            tests/test_guard_codex_browser_authority.py \
            tests/test_guard_presentation_mode.py
          uv run --no-sync pytest -q \
            tests/test_guard_presentation_mode.py \
            tests/test_guard_action_explanation_contract.py \
            tests/test_guard_codex_browser_authority.py \
            tests/test_guard_settings_api.py \
            tests/test_guard_desktop_contract.py
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.6'
      - name: Validate dashboard
        shell: bash
        working-directory: dashboard
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run test
          bun run build
      - name: Replace polluted PR head with validated commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'feat: complete Everyday Mode Core on release/3.2'
          head_sha="$(git rev-parse HEAD)"
          expected_head="$(cat /tmp/expected-head)"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$expected_head" origin HEAD:"$TARGET_BRANCH"
          gh api --method POST "repos/${{ github.repository }}/statuses/$head_sha" \
            -f state=success \
            -f context='everyday-mode/controller-validation' \
            -f description='Core contracts, focused tests, decision diff, and dashboard validated'
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Resolve only validated or removed review threads
        shell: bash
        env:
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess
          owner, repo = os.environ['GITHUB_REPOSITORY'].split('/', 1)
          pr = int(os.environ['PR_NUMBER'])
          validated = set(pathlib.Path('/tmp/validated-product-paths').read_text().splitlines())
          removed_prefixes = ('.github/scripts/pr_review_fix_agent.py', '.github/workflows/')
          query = '''query($owner:String!,$repo:String!,$pr:Int!,$cursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewThreads(first:100,after:$cursor){nodes{id isResolved path comments(first:20){nodes{databaseId body}}}pageInfo{hasNextPage endCursor}}}}}'''
          cursor = None
          threads = []
          while True:
              raw = subprocess.check_output(['gh','api','graphql','-f',f'query={query}','-F',f'owner={owner}','-F',f'repo={repo}','-F',f'pr={pr}',*(['-F',f'cursor={cursor}'] if cursor else [])], text=True)
              data = json.loads(raw)['data']['repository']['pullRequest']['reviewThreads']
              threads.extend(data['nodes'])
              if not data['pageInfo']['hasNextPage']:
                  break
              cursor = data['pageInfo']['endCursor']
          mutation = 'mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{id isResolved}}}'
          for thread in threads:
              if thread['isResolved']:
                  continue
              path = thread.get('path') or ''
              eligible = path in validated or path.startswith(removed_prefixes)
              if not eligible:
                  continue
              subprocess.check_call(['gh','api','graphql','-f',f'query={mutation}','-F',f'id={thread["id"]}'])
          # Fail closed if any conversation remains unresolved.
          cursor = None
          unresolved = []
          while True:
              raw = subprocess.check_output(['gh','api','graphql','-f',f'query={query}','-F',f'owner={owner}','-F',f'repo={repo}','-F',f'pr={pr}',*(['-F',f'cursor={cursor}'] if cursor else [])], text=True)
              data = json.loads(raw)['data']['repository']['pullRequest']['reviewThreads']
              unresolved.extend(t for t in data['nodes'] if not t['isResolved'])
              if not data['pageInfo']['hasNextPage']:
                  break
              cursor = data['pageInfo']['endCursor']
          if unresolved:
              raise SystemExit('Unresolved review threads remain: ' + ', '.join((t.get('path') or '<unknown>') for t in unresolved))
          PY
      - name: Require successful PR checks for exact head
        shell: bash
        env:
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            actual="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
            test "$actual" = "$HEAD_SHA"
            checks="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json name,state,bucket 2>/tmp/checks.err)" || { cat /tmp/checks.err >&2; exit 1; }
            count="$(jq 'length' <<< "$checks")"
            test "$count" -gt 0
            failing="$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<< "$checks")"
            pending="$(jq '[.[] | select(.bucket == "pending")] | length' <<< "$checks")"
            test "$failing" -eq 0
            if [ "$pending" -eq 0 ]; then
              exit 0
            fi
            sleep 30
          done
          echo 'Timed out waiting for PR checks.' >&2
          exit 1
      - name: Merge without bypassing repository rules
        shell: bash
        env:
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: |
          set -euo pipefail
          actual="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          test "$actual" = "$HEAD_SHA"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
