name: Complete Everyday Mode end to end on release 3.2

on:
  push:
    branches:
      - feat/everyday-mode-001-100-v32
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write
  models: read

concurrency:
  group: everyday-mode-complete-release-3-2
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.EVERYDAY_MODE_OPENAI_MODEL }}
      GITHUB_MODELS_MODEL: ${{ vars.EVERYDAY_MODE_GITHUB_MODEL }}
      SOURCE_BRANCH: feat/everyday-mode-001-100-v32
      DELIVERY_BRANCH: feat/everyday-mode-complete-release-3.2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/everyday-mode-001-100-v32
          fetch-depth: 0
          persist-credentials: true
      - name: Validate authoritative specifications
        shell: bash
        run: |
          set -euo pipefail
          prd=docs/everyday-mode/HOL_GUARD_EVERYDAY_MODE_PRD.md
          todo=docs/everyday-mode/HOL_GUARD_EVERYDAY_MODE_TODO.md
          test -s "$prd"
          test -s "$todo"
          test "$(wc -c < "$prd")" -gt 1000
          test "$(wc -c < "$todo")" -gt 10000
          grep -q 'EVM-001' "$todo"
          grep -q 'EVM-740' "$todo"
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('docs/everyday-mode/HOL_GUARD_EVERYDAY_MODE_TODO.md').read_text()
          ids = {int(value) for value in re.findall(r'\bEVM-(\d{3})\b', text)}
          missing = sorted(set(range(1, 741)) - ids)
          if missing:
              raise SystemExit(f'missing TODO IDs: {missing[:30]}')
          PY
      - name: Collect existing review threads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ['GITHUB_TOKEN']
          owner = 'hashgraph-online'
          repo = 'hol-guard'
          query = '''query($owner:String!,$repo:String!,$number:Int!,$cursor:String){
            repository(owner:$owner,name:$repo){pullRequest(number:$number){
              reviewThreads(first:100,after:$cursor){
                nodes{id isResolved path line comments(first:100){nodes{author{login} body url createdAt}}}
                pageInfo{hasNextPage endCursor}
              }
            }}
          }'''
          collected = []
          for number in (2629, 2588):
              cursor = None
              while True:
                  body = json.dumps({'query': query, 'variables': {'owner': owner, 'repo': repo, 'number': number, 'cursor': cursor}}).encode()
                  request = urllib.request.Request(
                      'https://api.github.com/graphql', data=body, method='POST',
                      headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json', 'User-Agent': 'everyday-mode-agent'}
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          payload = json.load(response)
                  except Exception as exc:
                      collected.append({'pull_request': number, 'retrieval_error': str(exc)})
                      break
                  pr = ((payload.get('data') or {}).get('repository') or {}).get('pullRequest')
                  if not pr:
                      break
                  threads = pr['reviewThreads']
                  for node in threads['nodes']:
                      node['pull_request'] = number
                      if not node.get('isResolved'):
                          collected.append(node)
                  page = threads['pageInfo']
                  if not page['hasNextPage']:
                      break
                  cursor = page['endCursor']
          with open('/tmp/everyday-review-threads.json', 'w') as handle:
              json.dump(collected, handle, indent=2)
          PY
      - name: Build release 3.2 integration branch from correct existing work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -B "$DELIVERY_BRANCH" origin/release/3.2
          git show "$SOURCE_BRANCH":docs/everyday-mode/HOL_GUARD_EVERYDAY_MODE_PRD.md > /tmp/HOL_GUARD_EVERYDAY_MODE_PRD.md
          git show "$SOURCE_BRANCH":docs/everyday-mode/HOL_GUARD_EVERYDAY_MODE_TODO.md > /tmp/HOL_GUARD_EVERYDAY_MODE_TODO.md
          git show "$SOURCE_BRANCH":.github/scripts/everyday_mode_github_models_agent.py > /tmp/everyday_mode_agent.py
          merge_feature() {
            branch="$1"
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              return 0
            fi
            if git merge-base --is-ancestor "origin/$branch" HEAD; then
              return 0
            fi
            set +e
            git merge --no-ff --no-commit -X theirs "origin/$branch"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              while IFS= read -r path; do
                [ -n "$path" ] || continue
                case "$path" in
                  .github/workflows/*|ci/code-quality-baseline.json|ci/test-suite-ratchet-baseline.json|dashboard/package.json|dashboard/bun.lock*|pyproject.toml|uv.lock)
                    git checkout --ours -- "$path" || git rm -f -- "$path"
                    ;;
                  *)
                    git checkout --theirs -- "$path" || git rm -f -- "$path"
                    ;;
                esac
                git add -A -- "$path"
              done <<< "$conflicts"
              test -z "$(git diff --name-only --diff-filter=U)"
            fi
            git commit -m "feat(everyday): integrate existing ${branch#feat/everyday-mode-} work"
          }
          merge_feature feat/everyday-mode-001-100-final
          merge_feature feat/everyday-mode-001-100-v32
          merge_feature feat/everyday-mode-101-200
          merge_feature feat/everyday-mode-201-300
          rm -f .github/workflows/everyday-mode-*.yml
          mkdir -p docs/everyday-mode .github/scripts
          cp /tmp/HOL_GUARD_EVERYDAY_MODE_PRD.md docs/everyday-mode/HOL_GUARD_EVERYDAY_MODE_PRD.md
          cp /tmp/HOL_GUARD_EVERYDAY_MODE_TODO.md docs/everyday-mode/HOL_GUARD_EVERYDAY_MODE_TODO.md
          cp /tmp/everyday_mode_agent.py .github/scripts/everyday_mode_github_models_agent.py
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/everyday_mode_github_models_agent.py')
          text = path.read_text()
          start = text.index('def tool_git_diff(')
          end = text.index('\n\n\nTOOL_HANDLERS', start)
          replacement = '''def tool_git_diff(arguments: dict[str, Any]) -> str:
              path = arguments.get("path")
              command = "git diff --stat && git status --short && git diff --"
              if path:
                  _inside_root(Path(path))
                  command += " " + shlex.quote(path)
              return tool_run_command({"command": command, "timeout": 180})
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          chmod +x .github/scripts/everyday_mode_github_models_agent.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(everyday): prepare release/3.2 completion workspace'
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.6'
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv pip install 'ruff==0.15.17' 'pytest==9.0.3' 'pytest-cov==7.1.0'
          if [ -f dashboard/package.json ]; then
            (cd dashboard && bun install --frozen-lockfile)
          fi
      - name: Implement and verify every EVM batch
        shell: bash
        run: |
          set -euo pipefail
          ranges=(001-100 101-200 201-300 301-400 401-500 501-600 601-700 701-740)
          for range in "${ranges[@]}"; do
            start="${range%-*}"
            end="${range#*-}"
            python .github/scripts/everyday_mode_github_models_agent.py \
              --start "$((10#$start))" \
              --end "$((10#$end))" \
              --review-file /tmp/everyday-review-threads.json \
              --max-turns 120
            .venv/bin/ruff format src tests scripts 2>/dev/null || true
            .venv/bin/ruff check --fix src tests scripts 2>/dev/null || true
            git add -A
            if git diff --cached --quiet; then
              python - <<PY
          import json
          from pathlib import Path
          start, end = $((10#$start)), $((10#$end))
          path = Path('docs/everyday-mode/completion-ledger.json')
          if not path.exists():
              raise SystemExit(f'agent made no change and no ledger exists for {start}-{end}')
          data = json.loads(path.read_text())
          records = data.get('tasks', data) if isinstance(data, dict) else data
          by_id = {str(item.get('id', '')): item for item in records if isinstance(item, dict)}
          missing = [f'EVM-{number:03d}' for number in range(start, end + 1) if by_id.get(f'EVM-{number:03d}', {}).get('status') != 'verified']
          if missing:
              raise SystemExit(f'unverified range: {missing[:20]}')
          PY
            else
              git commit -m "feat(everyday): complete EVM-${start}-${end}"
            fi
          done
      - name: Validate completion ledger covers all 740 tasks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/everyday-mode/completion-ledger.json')
          data = json.loads(path.read_text())
          records = data.get('tasks', data) if isinstance(data, dict) else data
          by_id = {str(item.get('id', '')): item for item in records if isinstance(item, dict)}
          missing = []
          weak = []
          for number in range(1, 741):
              task_id = f'EVM-{number:03d}'
              item = by_id.get(task_id)
              if not item or item.get('status') != 'verified':
                  missing.append(task_id)
                  continue
              if not item.get('files') or not item.get('tests') or not item.get('evidence'):
                  weak.append(task_id)
          if missing or weak:
              raise SystemExit(f'ledger incomplete: missing={missing[:20]} weak={weak[:20]}')
          PY
      - name: Run release 3.2 validation and autonomous repair loop
        shell: bash
        run: |
          set -euo pipefail
          validate() {
            : > /tmp/everyday-validation.log
            set +e
            .venv/bin/ruff check src tests scripts >> /tmp/everyday-validation.log 2>&1
            ruff_rc=$?
            .venv/bin/pytest -q >> /tmp/everyday-validation.log 2>&1
            pytest_rc=$?
            if [ -f dashboard/package.json ]; then
              (cd dashboard && bun run test && bun run build) >> /tmp/everyday-validation.log 2>&1
              dashboard_rc=$?
            else
              dashboard_rc=0
            fi
            if [ -f Cargo.toml ]; then
              cargo test --workspace --all-targets >> /tmp/everyday-validation.log 2>&1
              cargo_rc=$?
            else
              cargo_rc=0
            fi
            set -e
            [ "$ruff_rc" -eq 0 ] && [ "$pytest_rc" -eq 0 ] && [ "$dashboard_rc" -eq 0 ] && [ "$cargo_rc" -eq 0 ]
          }
          for attempt in 1 2 3; do
            if validate; then
              break
            fi
            cp /tmp/everyday-validation.log /tmp/everyday-review-threads.json
            python .github/scripts/everyday_mode_github_models_agent.py \
              --start 1 --end 740 \
              --review-file /tmp/everyday-review-threads.json \
              --max-turns 100
            .venv/bin/ruff format src tests scripts 2>/dev/null || true
            .venv/bin/ruff check --fix src tests scripts 2>/dev/null || true
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "fix(everyday): remediate full-suite validation attempt ${attempt}"
            fi
            if [ "$attempt" -eq 3 ]; then
              validate
            fi
          done
      - name: Run ratchets and decision evidence
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python tests/guard_command_decision_diff.py --write
          .venv/bin/python tests/guard_command_decision_diff.py --check
          .venv/bin/python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          .venv/bin/python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/test-inventory.json
          .venv/bin/python scripts/ci/code_quality_audit.py --root . --baseline ci/code-quality-baseline.json --json-output /tmp/code-quality-audit.json
      - name: Write final verification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/everyday-mode
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          sha = __import__('subprocess').check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          log = Path('/tmp/everyday-validation.log').read_text(errors='replace') if Path('/tmp/everyday-validation.log').exists() else ''
          Path('docs/everyday-mode/verification.md').write_text(
              '# Everyday Mode release/3.2 verification\n\n'
              f'- Generated: {datetime.now(timezone.utc).isoformat()}\n'
              f'- Source commit before evidence commit: `{sha}`\n'
              '- Scope: EVM-001 through EVM-740\n'
              '- Target: `release/3.2`\n\n'
              '## Required validation\n\n'
              '- `ruff check src tests scripts`\n'
              '- full `pytest -q` suite\n'
              '- dashboard test and production build\n'
              '- Rust workspace tests when Cargo workspace is present\n'
              '- command decision diff write/check\n'
              '- test-suite ratchet\n'
              '- code-quality audit\n\n'
              '## Final full-suite output\n\n```text\n' + log[-50000:] + '\n```\n'
          )
          PY
          rm -f .github/scripts/everyday_mode_github_models_agent.py
          git add -A
          git commit -m 'docs(everyday): record complete EVM-001-740 verification'
      - name: Publish completion branch and pull request
        shell: bash
        run: |
          set -euo pipefail
          git push -f origin HEAD:"$DELIVERY_BRANCH"
          existing="$(gh pr list --repo hashgraph-online/hol-guard --state open --head "$DELIVERY_BRANCH" --json number --jq '.[0].number // empty')"
          body_file=/tmp/everyday-pr-body.md
          cat > "$body_file" <<'EOF'
          ## Scope
          Completes the authoritative Everyday Mode PRD and TODO from EVM-001 through EVM-740 on `release/3.2`.

          ## Evidence
          - Per-task implementation ledger: `docs/everyday-mode/completion-ledger.json`
          - End-to-end verification: `docs/everyday-mode/verification.md`
          - Existing work from the 001-100, 101-200, and 201-300 branches was reconciled before completing the remaining batches.
          - Open review findings from the existing Everyday Mode pull requests were supplied to the remediation agent.
          EOF
          if [ -z "$existing" ]; then
            gh pr create --repo hashgraph-online/hol-guard --base release/3.2 --head "$DELIVERY_BRANCH" --title 'feat: complete Everyday Mode EVM-001-740 on release/3.2' --body-file "$body_file"
          else
            gh pr edit "$existing" --repo hashgraph-online/hol-guard --base release/3.2 --title 'feat: complete Everyday Mode EVM-001-740 on release/3.2' --body-file "$body_file"
          fi
