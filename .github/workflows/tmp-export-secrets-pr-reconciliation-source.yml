name: Export exact release 3 source for secrets PR reconciliation

on:
  push:
    branches:
      - tmp/secrets-pr-reconciliation-source-20260825
    paths:
      - .github/workflows/tmp-export-secrets-pr-reconciliation-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-secrets-pr-reconciliation-source
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: release/3.0
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/release-head.txt"
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=dashboard/node_modules \
            --exclude='**/__pycache__' \
            -czf "$RUNNER_TEMP/release-3-secrets-reconciliation-source.tar.gz" .
      - name: Upload exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-3-secrets-reconciliation-source
          path: |
            ${{ runner.temp }}/release-3-secrets-reconciliation-source.tar.gz
            ${{ runner.temp }}/release-head.txt
          if-no-files-found: error
          retention-days: 1
