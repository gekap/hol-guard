name: Export secrets PR merge bases for reconciliation

on:
  push:
    branches:
      - tmp/secrets-pr-reconciliation-source-20260825
    paths:
      - .github/workflows/tmp-export-secrets-pr-reconciliation-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-secrets-pr-reconciliation-source
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out PR 2359 merge base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fa7dd0fdf50eb1427a0b3dba0e40225dfca82a2e
          path: pr2359-base
          fetch-depth: 1
          persist-credentials: false
      - name: Check out PR 2363 merge base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: c7086ba0bfb10d6f1a5f98a3306c8560af4c0518
          path: pr2363-base
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact merge-base sources
        shell: bash
        run: |
          set -euo pipefail
          git -C pr2359-base rev-parse HEAD > "$RUNNER_TEMP/pr2359-base-head.txt"
          git -C pr2363-base rev-parse HEAD > "$RUNNER_TEMP/pr2363-base-head.txt"
          tar --exclude=.git --exclude=.venv --exclude=dashboard/node_modules --exclude='**/__pycache__' -C pr2359-base -czf "$RUNNER_TEMP/pr2359-base-source.tar.gz" .
          tar --exclude=.git --exclude=.venv --exclude=dashboard/node_modules --exclude='**/__pycache__' -C pr2363-base -czf "$RUNNER_TEMP/pr2363-base-source.tar.gz" .
      - name: Upload exact merge bases
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secrets-pr-merge-base-sources
          path: |
            ${{ runner.temp }}/pr2359-base-source.tar.gz
            ${{ runner.temp }}/pr2359-base-head.txt
            ${{ runner.temp }}/pr2363-base-source.tar.gz
            ${{ runner.temp }}/pr2363-base-head.txt
          if-no-files-found: error
          retention-days: 1
