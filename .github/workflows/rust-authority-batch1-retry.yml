name: Rust authority batch 1 focused implementation

on:
  push:
    branches: [fix/rust-authority-batch-1]
    paths:
      - ".github/workflows/rust-authority-batch1-retry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-authority-batch-1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Apply deterministic migration
        run: uv run --no-sync python scripts/ci/apply_rust_pretool_authority_batch1.py
      - name: Format source
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/cli.py \
            src/codex_plugin_scanner/guard/native_pretool.py \
            src/codex_plugin_scanner/guard/native_pretool_cli.py \
            src/codex_plugin_scanner/guard/native_command_model.py \
            src/codex_plugin_scanner/guard/daemon/hook_worker.py \
            scripts/ci/check_rust_pretool_authority.py \
            scripts/integration/rust_pretool_authority.py
      - name: Enforce authority and lint
        run: |
          uv run --no-sync python scripts/ci/check_rust_pretool_authority.py
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/cli.py \
            src/codex_plugin_scanner/guard/native_pretool.py \
            src/codex_plugin_scanner/guard/native_pretool_cli.py \
            src/codex_plugin_scanner/guard/native_command_model.py \
            src/codex_plugin_scanner/guard/daemon/hook_worker.py \
            scripts/ci/check_rust_pretool_authority.py \
            scripts/integration/rust_pretool_authority.py
      - name: Build native runtime
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          export HOL_GUARD_PACKAGE_VERSION="$VERSION"
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
          rust/target/release/hol-guard-runtime self-test --json
      - name: Run real-binary integration
        env:
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: uv run --no-sync python scripts/integration/rust_pretool_authority.py
      - name: Commit proven implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            rust/crates/guard-runtime/src/main.rs \
            rust/crates/guard-runtime/src/pretool.rs \
            src/codex_plugin_scanner/cli.py \
            src/codex_plugin_scanner/guard/native_pretool.py \
            src/codex_plugin_scanner/guard/native_pretool_cli.py \
            src/codex_plugin_scanner/guard/native_command_model.py \
            src/codex_plugin_scanner/guard/daemon/hook_worker.py \
            scripts/ci/check_rust_pretool_authority.py \
            scripts/integration/rust_pretool_authority.py \
            .github/workflows/rust-command-shadow.yml \
            docs/guard/rust-migration-batch-1-tasks.md
          git diff --cached --check
          git commit -m "feat(guard): make PreToolUse Rust authoritative"
          git push origin HEAD:fix/rust-authority-batch-1
