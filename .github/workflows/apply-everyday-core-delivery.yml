name: Apply verified Everyday Mode Core delivery

on:
  push:
    branches:
      - automation/everyday-core-delivery-20260828
    paths:
      - .github/workflows/apply-everyday-core-delivery.yml

permissions:
  contents: write
  actions: write
  pull-requests: read
  checks: read

concurrency:
  group: everyday-core-clean-delivery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/everyday-mode-001-100-final
      TARGET_BASE: release/3.2
    steps:
      - name: Check out immutable staging commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and verify deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/everyday-payload/core-000.b64 \
            .github/everyday-payload/core-001.b64 \
            .github/everyday-payload/core-002.b64 \
            .github/everyday-payload/core-003.b64 \
            .github/everyday-payload/core-rem-00.b64 \
            .github/everyday-payload/core-rem-01.b64 \
            .github/everyday-payload/core-rem-02.b64 \
            > "$RUNNER_TEMP/core.patch.gz.b64"
          test "$(wc -c < "$RUNNER_TEMP/core.patch.gz.b64")" -eq 155736
          echo '2c89fbef608d80006fad320844d5a59bcf610a884e4013a49db4c316285225aa  '"$RUNNER_TEMP/core.patch.gz.b64" | sha256sum --check
          base64 --decode "$RUNNER_TEMP/core.patch.gz.b64" > "$RUNNER_TEMP/core.patch.gz"
          echo '8aef82d90217e2936a6200099f902815f16f540e865da375c8b2a01ff975d45e  '"$RUNNER_TEMP/core.patch.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/core.patch.gz" > "$RUNNER_TEMP/core.patch"
          echo 'b70b55098e1a41e9989921f82e7e013b329822ac1b23d17266f0d67e523a5eda  '"$RUNNER_TEMP/core.patch" | sha256sum --check

      - name: Rebuild a clean release 3.2 product head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$TARGET_BASE"
          git checkout -B everyday-clean "origin/$TARGET_BASE"
          git apply --check "$RUNNER_TEMP/core.patch"
          git apply --index "$RUNNER_TEMP/core.patch"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -E '^\.github/(workflows|scripts)/'; then
            echo 'Product patch unexpectedly contains temporary automation.' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'

      - name: Install Python dependencies
        shell: bash
        run: uv sync --frozen --extra dev --python 3.12

      - name: Validate Core contracts and semantics
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m compileall -q src
          .venv/bin/pytest -q \
            tests/test_guard_presentation_mode.py \
            tests/test_guard_action_explanation_contract.py \
            tests/test_guard_action_explanation_builder.py \
            tests/test_guard_semantic_explanations.py \
            tests/test_guard_command_extension_explanations.py \
            tests/test_guard_typed_action_explanations.py \
            tests/test_guard_everyday_semantic_201_300.py \
            tests/test_guard_everyday_semantic_301_380.py \
            tests/test_guard_action_explanation_projection.py \
            tests/test_guard_presentation_support_contracts.py
          .venv/bin/python tests/guard_command_decision_diff.py --write
          .venv/bin/python tests/guard_command_decision_diff.py --check

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.6'

      - name: Validate dashboard
        shell: bash
        working-directory: dashboard
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsx src/presentation-mode.test.ts
          bunx tsx src/action-explanation.test.tsx
          bunx tsx src/everyday-semantic-201-300.test.tsx
          bunx tsx src/home-dashboard.test.ts
          bun run build

      - name: Cancel stale writers on the delivery branch
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress waiting requested pending; do
            gh run list --repo hashgraph-online/hol-guard --branch "$TARGET_BRANCH" --status "$status" --limit 100 --json databaseId --jq '.[].databaseId' 2>/dev/null | while read -r run_id; do
              [ -n "$run_id" ] || continue
              gh run cancel "$run_id" --repo hashgraph-online/hol-guard || true
            done
          done
          sleep 10

      - name: Commit and publish the clean product head
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -s -m 'feat: complete Everyday Mode EVM-001-740'
          git push --force origin HEAD:"$TARGET_BRANCH"
