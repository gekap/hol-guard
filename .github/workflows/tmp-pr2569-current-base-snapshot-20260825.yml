name: Temporary exact PR 2569 base source snapshot

on:
  push:
    branches:
      - tmp/pr2569-current-base-snapshot-20260825-95032c
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/pr2569-current-base-snapshot-20260825-95032c
          fetch-depth: 1
          persist-credentials: false
      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr2569-base-source-${{ github.sha }}
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
          if-no-files-found: error
