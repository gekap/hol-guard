name: Network local toolchain bootstrap

on:
  push:
    branches:
      - fix/network-isolation-remediation-rem121-139

permissions:
  contents: read

jobs:
  package-build-tools:
    runs-on: ubuntu-24.04
    steps:
      - name: Collect offline build and validation tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheels
          python -m pip download --dest wheels 'hatchling<1.31' hatch-vcs ruff mypy
          sha256sum wheels/* > wheels/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: network-local-build-tools
          path: wheels/
          if-no-files-found: error
          retention-days: 1
