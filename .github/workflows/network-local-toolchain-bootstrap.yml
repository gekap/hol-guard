name: Network local toolchain bootstrap

on:
  push:
    branches:
      - fix/network-isolation-remediation-rem121-139

permissions:
  contents: read

jobs:
  package-rootless-tools:
    runs-on: ubuntu-24.04
    steps:
      - name: Collect rootless Docker support tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rootlesskit slirp4netns uidmap fuse-overlayfs
          mkdir -p rootless/bin rootless/lib
          for name in rootlesskit slirp4netns newuidmap newgidmap fuse-overlayfs docker-init; do
            path="$(command -v "$name" || true)"
            if [[ -n "$path" ]]; then
              cp -L "$path" "rootless/bin/$name"
              ldd "$path" 2>/dev/null | awk '/=> \/|^\// { for (i=1; i<=NF; i++) if ($i ~ /^\//) print $i }' || true
            fi
          done | sort -u > rootless/library-paths.txt
          while IFS= read -r library; do
            [[ -f "$library" ]] || continue
            destination="rootless/lib${library}"
            mkdir -p "$(dirname "$destination")"
            cp -L "$library" "$destination"
          done < rootless/library-paths.txt
          test -x rootless/bin/rootlesskit
          test -x rootless/bin/slirp4netns
          test -x rootless/bin/newuidmap
          test -x rootless/bin/newgidmap
          tar -C rootless -czf rootless-docker-tools.tar.gz .
          sha256sum rootless-docker-tools.tar.gz > rootless-docker-tools.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: network-local-rootless-tools
          path: |
            rootless-docker-tools.tar.gz
            rootless-docker-tools.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
