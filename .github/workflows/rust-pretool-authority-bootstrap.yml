name: Rust PreToolUse authority bootstrap

on:
  push:
    branches: [fix/rust-authority-batch-1]
    paths:
      - ".github/workflows/rust-pretool-authority-bootstrap.yml"
      - "scripts/ci/bootstrap_rust_pretool_authority.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-pretool-authority-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install pinned toolchains
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          python -m pip install --disable-pip-version-check uv==0.9.26
          uv sync --frozen --extra dev --python 3.12
      - name: Import and verify the strongest native authority candidate
        env:
          BASE_REF: origin/release/3.0
        run: bash scripts/ci/bootstrap_rust_pretool_authority.sh
      - name: Commit verified implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No verified candidate changed the branch" >&2
            exit 1
          fi
          git add -A
          git commit -s -m "feat(rust): restore native PreToolUse authority"
          git push origin HEAD:fix/rust-authority-batch-1
