name: Complete Everyday Mode release 3.2 contracts v2

on:
  push:
    branches:
      - fix/everyday-mode-release-3.2-completion

permissions:
  contents: write

concurrency:
  group: everyday-mode-release-32-completion-v2
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/everyday-mode-release-3.2-completion
          fetch-depth: 0
          persist-credentials: true
      - name: Reapply deterministic completion patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'PyYAML==6.0.3'
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('.github/workflows/tmp-everyday-mode-release-32-completion.yml').read_text())
          command = next(step['run'] for step in data['jobs']['complete']['steps'] if step.get('name') == 'Apply deterministic completion patch')
          Path('/tmp/apply-everyday.sh').write_text(command)
          PY
          bash /tmp/apply-everyday.sh
      - name: Apply validation remediations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py')
          text = p.read_text()
          text = text.replace('resolved_home = getattr(args, "guard_home", None) or guard_home or config.guard_home', 'resolved_home = getattr(args, "guard_home", None) or guard_home')
          text = text.replace('        update_payload,\n            event_source="desktop-presentation",', '        update_payload,\n            event_source="desktop-presentation",')
          p.write_text(text)

          p = Path('tests/test_guard_desktop_contract.py')
          text = p.read_text()
          # Existing exact-shape assertions are allowed to ignore the new backwards-compatible presentation member.
          text = text.replace('assert payload == {', 'presentation = payload.pop("presentation", None)\n    assert presentation is not None\n    assert presentation["mode"] == "everyday"\n    assert payload == {', 1)
          p.write_text(text)
          PY
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.6'
      - name: Install Python dependencies
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv pip install 'ruff==0.15.17' 'pytest==9.0.3'
      - name: Ruff format
        run: |
          .venv/bin/ruff format src/codex_plugin_scanner/guard/presentation_mode.py src/codex_plugin_scanner/guard/presentation_migration.py src/codex_plugin_scanner/guard/config.py src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py tests/test_guard_action_explanation_contract.py tests/test_guard_desktop_contract.py tests/test_guard_everyday_mode_completion.py
      - name: Ruff check
        run: |
          .venv/bin/ruff check --fix src/codex_plugin_scanner/guard/presentation_mode.py src/codex_plugin_scanner/guard/presentation_migration.py src/codex_plugin_scanner/guard/config.py src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py tests/test_guard_action_explanation_contract.py tests/test_guard_desktop_contract.py tests/test_guard_everyday_mode_completion.py
          .venv/bin/ruff check src/codex_plugin_scanner/guard/presentation_mode.py src/codex_plugin_scanner/guard/presentation_migration.py src/codex_plugin_scanner/guard/config.py src/codex_plugin_scanner/guard/runtime/action_explanation_contract.py src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py tests/test_guard_action_explanation_contract.py tests/test_guard_desktop_contract.py tests/test_guard_everyday_mode_completion.py
      - name: Presentation tests
        run: .venv/bin/pytest -q tests/test_guard_presentation_mode.py tests/test_guard_everyday_mode_completion.py
      - name: Explanation tests
        run: .venv/bin/pytest -q tests/test_guard_action_explanation_contract.py
      - name: Desktop Core contract tests
        run: .venv/bin/pytest -q tests/test_guard_desktop_contract.py
      - name: Dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile
      - name: Dashboard tests
        run: cd dashboard && bun run test
      - name: Dashboard build
        run: cd dashboard && bun run build
      - name: Commit verified completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-everyday-mode-release-32-completion.yml .github/workflows/tmp-everyday-mode-release-32-completion-v2.yml
          git add -A
          git commit -m 'fix: complete Everyday Mode presentation contracts'
          git push origin HEAD:fix/everyday-mode-release-3.2-completion
